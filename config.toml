# claude-watch configuration
# Default location: ~/.config/claude-watch/config.toml

[general]
# Main check interval in seconds
check_interval = 10
# Path to persist state across restarts
state_file = "~/.config/claude-watch/state.json"
# Structured log output (JSON lines)
log_file = "/var/log/claude/claude-watch.jsonl"
# Also log to the legacy plain-text log for backwards compat
legacy_log_file = "/var/log/claude/claude-watch.log"
# Global post-interrupt cooldown (seconds). After ANY interrupt fires
# (prolonged-thinking, watcher-down, context-warning), suppress all new
# interrupts for this many seconds. Prevents cascading interrupts where a
# watcher-down interrupt fires mid-thought, resets the thinking timer, and
# then prolonged-thinking immediately re-fires on the newly-started thought.
# 0 disables the gate. Raised 60 -> 300 (2026-06-11): 5-min global
# interrupt ceiling. Per-type cooldowns are the inner lower-bound; this
# is the outer ceiling — a fire needs BOTH its per-type elapsed AND the
# global claim to succeed. User-overridable.
post_interrupt_cooldown_secs = 300
# Keep watcher-down EXEMPT from the global ceiling (a down watcher is a
# hard-liveness escape hatch). Set false to gate watcher-down too.
global_cooldown_exempt_watcher_down = true

[tmux]
# Override: pin Claude Code to a specific tmux pane.
# Default: empty = auto-detect the Claude Code pane via find_claude_pane().
# Set to a specific "session:window.pane" only to pin a fixed location:
# dashboard_pane = "dashboard:0.2"
dashboard_pane = ""
# Override: tmux session name where Claude Code runs (e.g. "dashboard").
# Leave empty or omit to auto-detect across all sessions.
dashboard_session = "dashboard"
# Settle delay (milliseconds) inserted between the ESC -> NORMAL-mode
# transition and the dd/i/text sequence inside inject_text. Default: 0
# (disabled — fast path). Tune up only if a particular environment shows
# follow-up keystrokes (typed prompt text, vim-mode dd/i, /clear, resume,
# etc.) being garbled or eaten because Claude Code's pane hasn't finished
# processing the Escape before the next keys arrive. Most setups don't
# need this — the ESC loop's per-iteration is_insert_mode() check already
# confirms each Escape was processed before the next is sent (and PR #46
# adds explicit INSERT-mode verification after `i`).
post_escape_settle_ms = 0
# FleetView "return to main" keystrokes, sent FIRST on every inject (before the
# Escape->NORMAL coercion loop and the typed payload) so injected text always
# lands on the MAIN conversation and never on a background agent that happens to
# be SELECTED in Claude Code's FleetView (Andrew #270/#288/#291). Claude Code's
# TUI routes typed input to the focused FleetView agent; its status bar shows
# `← for agents` (leftArrowOpensAgents) — LEFT moves focus INTO the fleet, so the
# inverse direction returns focus toward `main`. Each entry is a tmux send-keys
# key name (e.g. "Right", "Up", "Escape"), sent in order with a short settle;
# blank entries are ignored. Idempotent/safe on an already-on-main pane.
# Default: empty = no-op (behavior identical to before this knob). Set to the
# key(s) a LIVE FleetView confirms returns the selection to `main` — candidates:
# focus_main_keys = ["Right"]   or   focus_main_keys = ["Right", "Right", "Right"]
focus_main_keys = []

[claude]
# Max context window tokens
max_context_tokens = 1000000
# NOTE: `heartbeat_file` was REMOVED here on 2026-08-22. Liveness is the age of
# the main loop's last event ack -- see [ack] below. A config still carrying
# the key parses fine; the daemon logs one warning and ignores it.
# Relaunch script path (written on restart)
relaunch_script = "/var/run/claude/claude-relaunch.sh"

[dead_process]
# Consecutive zero-token checks before declaring dead
checks_required = 3
# Cooldown between restart attempts (seconds)
restart_cooldown = 300
# After this many dead checks with idle prompt (no shell), inject "resume"
# for externally-launched sessions (e.g. dashboard --fresh)
fresh_inject_checks = 5

[fresh_clear]
# Token range for detecting a fresh /clear
min_tokens = 2000
max_tokens = 5000
# Consecutive detections required before acting
detections_required = 2
# Cooldown between fast-path alerts (seconds)
cooldown = 120
# Window (seconds) after an OBSERVED context clear during which an idle pane
# sitting BELOW min_tokens still gets a resume inject.
#
# The [min_tokens, max_tokens) window cannot see the state a pane is actually
# in right after a /clear: Claude Code reports 0 tokens at the post-clear
# prompt and only publishes a count once the first turn lands, by which point
# the always-loaded preamble has carried it far above max_tokens in one step —
# so the window is stepped over and never sampled. The other gate that does
# handle tokens=0 requires bashes == 0, and background shells survive a
# /clear. Between them an operator-driven /clear on a session with a
# background command running gets no resume at all. This gate keys on a clear
# the daemon actually observed plus pane idleness, and ignores the
# background-shell count. 0 disables it.
post_clear_window_secs = 300

[ack]
# Minutes without ANY claude-event ack before the main loop is considered
# wedged. This is the SOLE liveness indicator.
#
# How it works, end to end:
#   1. The main loop handles an EVENT[...] batch and runs `event-ack ack-batch`
#      -- one bare command, prompted by the EVENT-ACK REQUIRED footer that
#      claude-event-watch prints after every batch in monitor mode.
#   2. That stamps <state_dir>/last-ack-timestamp.
#   3. The daemon reads its age here. ANY ack counts, so a loop busy handling
#      real work is proven alive by the work itself.
#   4. An IDLE loop has nothing to ack, so the daemon emits a `keepalive` event
#      once nothing has been acked for [cadence] keepalive_interval_secs. That
#      is the ONLY reason keepalive exists.
#
# Keep this comfortably above 2x keepalive_interval_secs (default 300s) so a
# single missed or undelivered keepalive can never trip it.
#
# Renamed from [heartbeat] on 2026-08-22 -- the old section name still parses.
# Before that, liveness was a separate host FILE the loop had to `touch`; two
# signals for one fact, and the file could stay fresh while events went unread.
stale_minutes = 20
# Directory holding last-ack-timestamp. Leave unset (or empty) to resolve it
# the same way event-ack does: $CLAUDE_EVENT_STATE_DIR, else
# ~/.config/claude-events. Deliberately NOT inside the event QUEUE dir --
# state written there gets counted as an unconsumed event.
#   state_dir = "/home/you/.config/claude-events"

[alerts]
# Initial cooldown between heartbeat-path alerts (seconds)
initial_cooldown = 600
# Escalation tiers: [cooldown_seconds, ...]
# After initial_cooldown fires twice, escalate
escalation_tiers = [600, 600, 1800, 3600, 3600, 3600]
# Stop push notifications (pingme) after this many alerts
max_pingme_alerts = 6
# Resume prompt injected into Claude Code
resume_prompt = "[CLAUDE-WATCH] Daemon detected stuck state: no background tasks running and not thinking. Please run the cleanup skill (/cleanup) to restart all watchers. If this alert fired incorrectly, DM Andrew with the details."
# Prompt injected on the ack-stale path specifically. The recovery action is
# ONE bare command with nothing to look up -- naming a key, or a file to
# touch, is friction on the exact path where the loop is already struggling.
# Plain-text directive — the loop reads it and emits its own well-formed tool
# call (injecting raw tool-call tags as pane text would render as prose and be
# silently dropped). Renamed from heartbeat_stale_prompt 2026-08-22; the old
# key name still parses.
ack_stale_prompt = "[CLAUDE-WATCH] No claude-event has been acked for longer than the stale window — from here the loop looks wedged. Run `event-ack ack-batch` NOW (one bare command; it acks every pending entry and stamps the liveness timestamp). Then check why events weren't reaching you (watcher-ctl status; is claude-event-watch up?). If this fired incorrectly, DM Andrew with the details."
# Prompt injected on the post-clear resume path specifically. That gate fires
# when a context clear was observed and the pane has been idle at an empty
# prompt ever since — and it fires WITH background shells alive, by design
# (surviving shells are why the other resume gates cannot cover this case).
# The generic resume_prompt above reports a stuck state with "no background
# tasks running" and asks for a watcher cleanup; on this path both halves are
# wrong, so it gets its own wording.
post_clear_resume_prompt = "[CLAUDE-WATCH] A context clear was observed and the pane has been idle at an empty prompt since — nothing has picked the work back up. Resume from your recorded resume action (session-task) and continue; do NOT run a watcher cleanup on account of this message. If your context was NOT cleared (the conversation above is intact), this fired incorrectly: ignore it, finish what you were doing, and DM Andrew with the details."

[foreground_monitor]
# Enable foreground blocking pattern detection
enabled = true
# Seconds of continuous foreground activity before warning.
# Raised 180 -> 300 on 2026-04-21: the shorter value was firing on legitimate
# long agent-return reads. 300s still catches real stuck states.
# Raised 300 -> 480 on 2026-05-30 (Andrew): prolonged-thinking alerts were
# self-feeding the watcher treadmill (every 5min thinking = a claude-event =
# claude-event-watch wake/exit = DOWN window = gate trip). 8min cuts the spam.
threshold_seconds = 480
# Check interval for foreground state (seconds) — independent of general.check_interval
check_interval = 3
# Interrupt when blocking/prolonged thinking detected (false = log-only mode)
interrupt_enabled = true
# Message injected after interrupting
interrupt_message = "The foreground command was backgrounded by claude-watch because it exceeded the timeout. Use run_in_background for long commands."
# Multiplier applied to threshold_seconds on each successive interrupt.
# With threshold_seconds=300 and multiplier=3 the sequence is 300, 900,
# 2700 (capped at max_thinking_backoff). Raised 2 -> 3 on 2026-04-21:
# if interrupt #1 didn't break the wedge, firing #2 quickly won't either.
thinking_backoff_multiplier = 3
# Token-progress guard (v2 sliding re-arm, 2026-06-11): Claude Code
# 2.1.17x keeps the assistant turn open — live thinking widget rendered —
# while background shells are pending, so the pane scrape reads continuous
# "Thinking" through pure idle waits and fires false prolonged-thinking
# interrupts. On every ongoing-thinking check, token growth >= this floor
# since the episode baseline re-arms the thinking timer (timer + baseline
# slide forward to now), so the timer only accumulates over genuinely
# growth-free time and the interrupt fires only after threshold_seconds
# of Thinking WITHOUT token progress — a parked/wedged turn. The count
# measures CONTEXT tokens: tool results and injected system reminders
# grow it (~3-7k per 480s observed) even when the assistant emits almost
# nothing, which keeps an idle-but-alive open turn re-arming forever —
# that same ambient growth is what defeated the v1 at-fire-time delta
# check (delta was always >= the floor, so it never suppressed anything).
# 0 disables the guard (legacy pure-timer behavior). If the count is
# unavailable at episode start the baseline is captured late at the first
# parseable check; if it never parses the fire fails open.
# Tuned 2000 -> 500 (2026-06-11 production calibration): very quiet idle
# periods can drip just under 2k context tokens per 480s window (observed
# tokens_delta=1857 on a false fire), so 2000 failed to re-arm and fired
# on a live turn. 500 re-arms on any real turn while a genuinely wedged
# zero-progress turn still fires.
min_tokens_delta = 500
# Ack-freshness gate (v3, 2026-06-11; re-sourced from the ack timestamp
# 2026-08-22): complements the token-progress guard above. An ultra-quiet but
# alive session (an event-driven loop handling only periodic events) can grow
# context tokens SLOWER than min_tokens_delta per backoff window (observed
# tokens_delta=230 on a false fire), so the v2 re-arm never engages and a
# parked-open idle turn still fires. The last-ack timestamp is a direct
# liveness signal: a wedged session stops acking by design, and the daemon's
# separate ack-stale detection escalates that case independently. At
# prolonged-thinking fire time, a last ack younger than this many seconds
# suppresses the fire and RE-ARMS the thinking timer (timer + token baseline
# slide to now, same as the v2 re-arm); a stale one lets the fire proceed.
# Fail-open: missing/unreadable stamp or future mtime allows the fire.
# 0 disables the gate. Default 600 = two keepalive windows, so a single
# missed ack doesn't mask a real wedge. Renamed from heartbeat_fresh_secs;
# the old key name still parses.
ack_fresh_secs = 600

[watcher_monitor]
# Enable individual watcher health tracking
enabled = true
# Watchers config file (same format as watchmen). This is the BASE layer.
watchers_config = "~/.config/watchmen/watchers.conf"
# Optional OVERRIDE layer (user-dir file, may be a symlink into a config
# repo): same-named entries override the base field-by-field, e.g.
# `claude-event-watch|mode=monitor`. When unset, the CLI's default applies
# ($WATCHERS_CONFIG_EXTRA, else ~/.config/watchmen/watchers.override.conf).
# watchers_config_extra = "~/.config/watchmen/watchers.override.conf"
# Expected watchmen supervisor count
expected_watchmen = 0
# Consecutive missing checks before the loud tmux-inject restart fires.
# KNOB #1 (grace before WATCHER(S) DOWN inject), 2026-06-24: raised 3 -> 18.
# The block-print-exit watcher cycle (claude-event-watch) now debounces up to
# ~120s (KNOB #2) before delivering events; the main loop must then READ all
# delivered events and RESTART the watcher. During that whole window the watcher
# is legitimately "missing". At a 10s check_interval, 18 consecutive misses is
# ~180s of SUSTAINED absence — comfortably past the normal debounce + read +
# restart gap — so the routine cycle no longer trips a down-inject. Only a
# genuinely-stuck loop (watcher never restarted) crosses this threshold.
inject_threshold = 18
# Cooldown between watcher-missing injections (seconds).
# KNOB #3 (watcher-down injection cadence), 2026-06-24: raised 60 -> 300.
# History: 300 (orig) -> 60 (PR #44, 2026-04-28, "re-inject quickly") ->
# 150 (PR, 2026-06-18) -> 300 here. Once a watcher-down inject has ALREADY
# fired and surfaced, re-nagging the main loop every 60s (or 150s) was the
# single most disruptive part of the storm: it kept seizing the loop while it
# was trying to read events and restart the watcher. When the watcher genuinely
# stays down, ~5min between re-injections is plenty — the operator still gets
# the out-of-band claude-event each cycle; this only throttles the heavyweight
# in-pane RE-FIRE, NOT initial detection latency (that is inject_threshold).
inject_cooldown = 300
# NOTE (2026-05-01): `auto_restart_cooldown_secs` was removed along with the
# daemon-side auto-restart path. Watchers can ONLY be spawned by Claude
# Code's main loop (cardinal rule); claude-watch's only emergency action
# is the tmux-inject above, which types `watcher-ctl run <name>` into the
# pane and lets the main loop spawn the watcher in its own process tree.
# Quiet path (PR #48): emit a `watcher-down` claude-event
# (source=claude-watch, tag=watcher-down) when consecutive_missing hits
# this threshold. Set below inject_threshold so the quiet path runs first
# and the loud tmux-inject is reserved as a fallback.
# KNOB #1, 2026-06-24: raised 3 -> 12 (~120s at 10s interval). The quiet
# `watcher-down` claude-event still fires well before the loud inject
# (inject_threshold=18, ~180s), but only after the ~120s event-delivery
# debounce window (KNOB #2) has had a chance to deliver + the loop to restart.
event_threshold = 12
# Grace period (seconds) after a quiet-path event is emitted, during
# which the heavyweight tmux-inject path is suppressed for the same
# watcher. If the watcher is still missing past the grace window, the
# inject path activates as fallback (covers the chicken-and-egg case
# where the consumer watcher itself is missing or stalled). Default 60.
event_grace_secs = 60
# Path to the `claude-event` CLI used to fire watcher-down events.
# Resolved via $PATH by default.
event_command = "claude-event"
# Watcher name whose absence makes the quiet path useless (no consumer
# for the event). When THIS watcher is the missing one, claude-watch
# skips event emission and falls through to inject immediately.
event_consumer_watcher_name = "claude-event-watch"
# KNOB #1 (grace before WATCHER(S) DOWN alert), 2026-06-24: set explicitly to 180.
# grace_secs is the window after a watcher's last_seen_running during which a
# missing watcher is NOT counted toward consecutive_missing at all. The
# block-print-exit watcher (claude-event-watch) legitimately exits every
# delivery; with the ~120s debounce (KNOB #2) the gap between exit and the
# loop's restart can be ~120-150s. 180s tolerance keeps that NORMAL cycle from
# ever beginning to accrue consecutive_missing, so no down-detection clock even
# starts during routine operation. (Code default is 90; made explicit here.)
grace_secs = 180
# KNOB #1 (grace), 2026-06-24: set explicitly to 180 (code default 30).
# health_grace_secs governs the `watcher-status --unhealthy-only` predicate the
# obligations gate consults on EVERY tool call. At 30s, the brief print-and-exit
# blip during the read/restart cycle could trip the gate and cancel whole
# batches of unrelated tool calls — a major contributor to the loop spending
# all its cycles on watcher churn instead of work. 180s matches grace_secs so
# only a SUSTAINED outage (down > 3min) trips the health gate.
health_grace_secs = 180
# clean_exit_grace_secs (KNOB #5): the block-print-exit watcher writes a
# `<name>.exit` marker right before its deliberate exit-0 after delivering a
# batch. While that marker is FRESHER than the pidfile (proof the current
# instance exited cleanly) and younger than this window, the daemon does NOT
# count a miss — so the WATCHER(S) DOWN flap during a busy-but-alive loop's
# restart gap stops, WITHOUT masking a real down: a crash writes no fresh
# marker (marker stays older than the freshly-rewritten pidfile → DOWN fires),
# and a dead session's marker ages past this window (heartbeat-stale /
# dead_process catch a dead session independently). 600s aligns with the
# heartbeat-stale window. 0 disables (pure grace_secs behaviour).
clean_exit_grace_secs = 600
# monitor_arming_grace_secs: ARMING window for `mode=monitor` watchers.
# `watcher-ctl run <name>` does not exec a monitor-mode watcher — it prints the
# Monitor-tool command for the main loop to arm and writes
# `<pid_dir>/<name>.monitor-intent`. For this many seconds after a fresh intent
# (one no runtime file has superseded) the watcher reads ARMING — healthy-
# pending — in `watcher-ctl status`, `watcher-status --unhealthy-only` (the
# obligations gate) and the daemon's watcher_monitor, so neither fires in the
# gap between "printed the command" and "the Monitor is live". A live pidfile
# flips it to ok; past the window with no pid it is DOWN again. Env override:
# $CLAUDE_WATCH_MONITOR_ARMING_GRACE_SECS. 0 disables (immediate DOWN).
monitor_arming_grace_secs = 120
# max_suppress_secs (per-watcher watcher-down suppression CAP), 2026-08-12.
# `suppress_inject_when_active` drops the in-pane watcher-down inject while the
# main loop is actively turning (the out-of-band claude-event still fires). But
# during a long active-turn stretch that suppression can persist indefinitely —
# real incident: botchat-wait (the operator comms channel) stayed down ~6 min
# with the inject suppressed the whole time, so the operator's messages never
# reached the session and he had to escalate manually. The SHARED
# [suppression].max_suppression_window_secs backstop can't fix this alone: it's
# tuned very high to tolerate the chronically-flapping surface-and-exit
# claude-event-watch. So bound suppression PER-WATCHER: once any down watcher's
# own continuous-down clock exceeds this many seconds, FORCE the inject even
# mid-turn (a comms watcher down this long outweighs not interrupting). Still
# throttled by inject_cooldown, so a genuinely-dead watcher re-injects at most
# once per cooldown window (no storm). 0 disables. Default 180 (3 min).
max_suppress_secs = 180

[context_monitor]
# Enable context usage monitoring and deferred self-clear
enabled = true
# Fixed token margin from max: trigger when tokens >= max - margin (overrides threshold_percent)
# 100K margin (trigger at 900K / 90%) gives headroom for accumulated image
# attachments (e.g., messaging-app photos we Read into context). Large images consume many tokens
# AND count against Anthropic's per-request image-dimension limit — firing the self-clear
# earlier prevents sessions from hitting the "image exceeds dimension limit for many-image
# requests" wall before the clear can land.
threshold_margin = 100000
# Token percentage threshold (legacy fallback, ignored when threshold_margin is set)
threshold_percent = 75
# Compact remaining % at which to trigger (primary — "Context left until auto-compact: N%")
compact_trigger_percent = 5
# Grace period before forced self-clear (seconds)
# Set to 300s (5min) — gives the agent enough time to wrap up the current
# turn (commit/push, session-task set, attendant tool calls) before the
# daemon force-clears. The deferred-clear child polls in 10s slices so
# fire-time matches displayed value within ~10s when tokens stay high
# (and the child exits cleanly with no clear if tokens drop below 30k).
grace_period = 300
# Minimum interval between context clear triggers (seconds)
cooldown = 300
# Hard arm-to-fire deadline (seconds) for the two-phase context-low
# obligation. Normal escalation also requires ZERO live subagents, so that an
# interrupt never cancels healthy in-flight work — but on a dispatcher that
# keeps subagents in flight that count is essentially never zero, and the
# obligation then stays ARMED forever while context climbs into the hard wall.
# Waiting for a quiet moment is not a recovery strategy when the loop you are
# waiting on is the stuck one. After this long armed, fire regardless of the
# subagent count. 0 disables the deadline (wait indefinitely).
max_armed_secs = 300

[malformed_tool_call]
# Detect MALFORMED tool calls — the model emitting raw, NON-namespaced
# `<invoke ...>` / `<parameter ...>` tags (often with a stray literal text
# prefix glued to the front) instead of a well-formed namespaced tool call.
# A correctly-formed call is consumed by the harness and shown only as a
# tool-use widget; the raw tags never reach the pane as text. So a raw
# non-namespaced tag visible in the live tail means the harness did NOT run
# the call — it rendered as plain assistant text and the INTENDED action
# (commonly `watcher-ctl run claude-event-watch`, a `signal-send`, or a
# event ack) silently never ran. Sustained, this strands one-shot
# watchers DOWN, drives the ack stale, and produces hours of
# failure / ack-stale / watcher-down alert storms (the 2026-06-17
# incident).
#
# Detection is STRUCTURAL (AST-style), not a substring grep: claude-watch
# tokenizes the candidate region and only fires on a confirmed tool-call
# CONSTRUCT — a non-namespaced `<invoke name="...">` opener corroborated by a
# `<parameter name="...">` and/or a `</invoke>` close — and it SKIPS anything
# inside a fenced code block (```...```). This is what cuts the false positives
# a plain grep produced on text turns that merely mention the tags.
#
# Enforcement is ESCALATING. A malformed call renders as assistant TEXT and
# never reaches a PreToolUse hook, so there is no true pre-execution block at
# this layer (the enforcement ceiling). The strongest feasible enforcement is a
# relentless escalating inject that halts forward progress until a clean call is
# observed: phase-1 soft nudge (cooldown-gated) escalating, after
# `escalate_after` un-cleared nudges, to a phase-2 HARD BLOCK that re-interrupts
# and re-injects EVERY cycle (no cooldown) until a clean turn appears.
enabled = true
# Consecutive check cycles the malformed signature must be observed before
# injecting the nudge (at the 10s general interval, 2 ≈ 20s of sustained
# malformation). Conservative so a single transient render — or a pane that
# merely quotes the tag strings — does not trip it.
consecutive = 2
# Cooldown between PHASE-1 (soft) corrective nudges (seconds). Avoids spamming
# the pane while the model recovers on its own. The phase-2 hard block ignores
# this cooldown.
cooldown = 180
# Number of soft nudges that may fire (without the malform ever clearing)
# before escalating to the phase-2 hard block. 0 = hard-block immediately;
# a very large value = stay nudge-only.
escalate_after = 2
# Marker file that, when present, fully disables malformed detection (manual
# false-positive override; mirrors the AskUserQuestion-allowed marker). Create
# it with `sudo touch <path>` while deliberately driving a turn about the tags;
# remove it to re-arm. Empty string disables the marker check.
override_marker = "/var/run/claude/malformed-detection-disabled"
# The PHASE-1 (soft) corrective text injected into the pane. Single-line by
# design (the inject_text vim-mode pipeline expects one literal send_keys -l
# call).
nudge = "claude-watch: your last tool call was MALFORMED (raw non-namespaced invoke/parameter tags rendered as text, so it did NOT run). A one-off: re-emit that exact action as a single well-formed tool call with NO stray text before the tag, then verify each watcher is up (watcher-ctl status) and re-run `event-ack ack-batch` if it was an event-ack turn. But if malformed calls KEEP recurring, the render state is poisoned and retrying will just reproduce them — run /clear to reset it instead of re-emitting the same call."
# The PHASE-2 (hard-block) corrective text. Firmer, and re-injected every cycle
# until the malform clears. On a recurring malform, blind re-emit reproduces the
# same stuck render state, so the hard block steers to /clear (rendering reset).
hard_block_nudge = "claude-watch HARD BLOCK: you are STILL emitting malformed (raw non-namespaced invoke/parameter) tool calls — re-emitting the same way keeps reproducing them because the render state is stuck. STOP retrying: run /clear NOW to reset the rendering state, then re-issue the single intended action as ONE well-formed tool call. claude-watch will keep interrupting every cycle until a clean call is observed."

[auto_update]
# Enable automatic version update checks
enabled = true
# Minute of hour (0-59) to check for updates
check_minute = 10
# Minimum hours between update attempts
cooldown_hours = 1
# Text injected into Claude Code after restart completes.
#
# This is the FIRST UserPromptSubmit the main loop sees after a
# claude-watch auto-update restart. Bare "resume" wasn't enough: at
# /exit time any in-flight subagent gets orphaned (its tmux pane is
# gone, its `claude-watch active-agents` entry goes stale, but its
# session-task queue row stays `running` and its PR — if any — stays
# open). Without an explicit orphan-recovery step in the resume
# prompt, PR-shipping work sits unmerged until something external
# (WorkQueueOrphaned alert, Andrew flagging) notices.
#
# This prompt makes recovery deterministic: run normal resume, audit
# the queue, probe each repo-scope running item against
# `claude-watch active-agents`, recover via PR state, leave
# workload:* alone (they survive restarts by design), then proceed.
#
# Single-line by design — tmux inject_text's vim-mode dd/i pipeline
# expects one literal send_keys -l call. Multi-line bodies fight
# Claude Code's Enter-to-submit input handling.
resume_prompt = "post-restart recovery: run `session-resume restart`, then for each `session-task queue list` running item whose agent is missing from `claude-watch active-agents` and scope is repo:* (NOT workload:* — workloads survive restart): probe PR state — open PR + green CI → spawn a merge-and-redeploy recovery agent (pass PR # + queue id); open PR + CI in-progress → spawn a CI-watch recovery agent; no PR → `session-task queue abandon <id> --confirmed-dead --reason 'agent orphaned across restart'` (--confirmed-dead because the restart demonstrably killed in-process agents; a bare abandon quarantines instead, holding the scope). Then resume normal dispatch."

[reauth]
# Detect when Claude Code needs API reauth and send high-priority alerts
enabled = true
# Interval between repeated alerts (seconds); 10800 = 3 hours
alert_interval_seconds = 10800

# Drive `self-login` automatically when Claude Code prints its in-TUI
#   Please run /login · API Error: 401 OAuth access token has expired.
# banner AND the credential store agrees the access token is dead (expiresAt
# in the past, or no token at all). The session can no longer make an API
# call at that point; the only alternative is a human typing /login.
#
# A sibling of expiry_auto_self_login below, kept separate because they
# interrupt different things: that one interrupts a WORKING session days
# early, this one acts on a session that has already stopped. Same retry /
# attempt / abandon bounds, same one-dialog-at-a-time latch. Banner text with
# a VALID token on disk is conversation and is ignored outright. When this is
# off the banner still raises the high-priority reauth alert — never silent.
auth_error_auto_self_login = true

# --- Proactive half -------------------------------------------------------
# Everything above reacts to credentials that are ALREADY dead, which means
# the recovery always lands at the worst possible moment. Everything below
# acts on Claude Code's own warning that they are ABOUT to be, while the
# session still works.

# Watch for the "Your login expires in N days · run /login to renew" warning.
# Turning this off leaves the reactive path untouched.
expiry_watch_enabled = true

# Drive `self-login` automatically, instead of only alerting.
#
# AUTO-FIRE IS INTRUSIVE BY NATURE: /login opens a modal that swallows the
# session's keystrokes until somebody pastes the authorization code, so the
# loop stops working until then. self_login_abandon_seconds is what bounds
# that. Set false to be told about the expiry and handle it yourself.
expiry_auto_self_login = true

# Auto-fire only once the warning is down to this many days. Claude Code
# starts SHOWING the warning three days out but only starts nagging inside
# one day, and one day is the right side of that line to interrupt a working
# session on.
expiry_auto_days = 1

# Minimum gap between auto-fire attempts (seconds). The warning persists for
# days, so without this a ten-second poll re-fires the flow all day.
self_login_retry_seconds = 3600

# Attempts allowed in one expiry window, reset when the credentials are
# actually renewed. Failing loudly is right; failing every hour forever is not.
self_login_max_attempts = 3

# Escape out of an unconsumed login dialog after this many seconds, handing
# the pane back. This is the answer to "auto-fire ran at 3am and nobody
# pasted the code": the OAuth link has a short life of its own, so parking
# the loop in a modal until morning buys nothing. 0 disables the watchdog.
self_login_abandon_seconds = 1800

# Let the credential store TRIGGER on its own, rather than only corroborating
# a warning seen on the pane.
#
# Off by default, for a measured reason. A refresh token can be short-lived
# and rolling: on one live host its whole lifetime was under five hours,
# renewed silently long before it lapsed. Against the three-day warning window
# that credential classifies as "expiring in 1 day" permanently, so a
# store-driven trigger fires forever on a session in no trouble at all. The
# on-screen warning does not have that failure mode — Claude Code renders it a
# bounded number of times, not continuously.
#
# Turn it on where the refresh token's lifetime is known to be long relative
# to the window. Check yours with `claude-watch login-expiry` before you do.
# The cost of leaving it off: the transient form of the warning is on screen
# for about fifteen seconds, so a poll can miss it.
expiry_from_credentials = false

# Claude Code's OAuth credential store, which the on-screen warning is
# corroborated against — "Your login expires in 2 days" is also just a
# sentence, and a session reading these docs will have it on the pane while
# perfectly well authenticated. Empty = $HOME/.claude/.credentials.json.
# An unreadable store is UNKNOWN, not a negative: the pane signal still acts,
# and the alert says it stands alone.
credentials_file = ""

# Command used to drive the login flow.
self_login_command = "self-login"

[task_watch]
# Enable task-watch daemon loop (auto-manage tmux panes for background tasks)
enabled = true
# Tmux session name for task panes
session = "tasks"
# Poll interval for /proc scanning (seconds)
poll_interval = 5
# Delay before removing panes after task completes (seconds)
done_delay = 10
# Longer delay for agent panes (agents have gaps between writes)
agent_done_delay = 120
# Maximum number of task panes
max_panes = 20
# Show all tasks including persistent watchers (false = workloads only)
show_all = false

[suppression]
# Cross-gate suppression-escalation backstop. The watcher-down, fresh-/clear,
# and dead-process suppression gates each defer their inject when the main
# loop is "actively turning". A long sustained dispatcher window can hold
# the gate open indefinitely (real incident 2026-04-27: claude-event-watch
# was suppressed for 33 min). These two limits cap the suppression run.
# When EITHER trips on the next gate-fire, the fire force-injects regardless.
# Counters are SHARED across all three gates (see State.consecutive_suppressions).
#
# After this many consecutive suppressed fires, the next fire force-injects.
# Raised 3 -> 10000 (2026-06-23, Andrew): claude-event-watch is surface-and-exit
# (it exits after every event), so its watcher-down condition is PERPETUAL and
# the suppression counter never resets while the main loop is actively turning +
# restarting it. At cap=3 the escalation force-injected a destructive tmux
# interrupt every ~30s, which cancelled in-flight turns and KILLED freshly
# spawned background agents (the all-night "agent stopped by user" mystery).
# The heartbeat-stale path remains the genuine-wedge backstop, so suppressing
# this force-inject while actively-turning is safe. Root fix (make
# claude-event-watch a resident poller so it stops flapping) is a follow-up.
max_consecutive_suppressions = 10000
# Wall-clock backstop (seconds) since the FIRST suppression in the current run.
# Raised 600 -> 86400 for the same reason as the consecutive cap above.
max_suppression_window_secs = 86400

[api_retry]
# Upstream-API retry-backoff detection.
#
# When Anthropic returns 529 (overloaded) or transient 5xx errors, Claude Code
# retries with exponential backoff and prints lines like:
#   API Error: 529 {"type":"error","error":{"type":"overloaded_error",...}}
#   ⎿  Retrying in 24s · attempt 3/10
# During that window a cancelling inject (Escape + text) wipes the retry
# state machine and forces Claude to start a brand-new turn — which then hits
# the same overload and re-enters retry. The result is a livelock where the
# daemon's interrupts perpetually reset the retry timer (seen 2026-04-28).
#
# When this guard is enabled, the daemon detects the retry banner each cycle
# and suppresses fires from the four sites that matter (prolonged-thinking,
# watcher-down, context-warning, wedged-clear) until the retry resolves OR
# max_stuck_secs elapses (whichever happens first). Heartbeat / dead-process
# detection are NOT suppressed — those measure liveness and must still alert.
enabled = true
# Number of consecutive check cycles a retry banner must be observed before
# suppression activates. Default 1 (suppress on first detection — the cost of
# a missed interrupt is negligible compared to the cost of resetting the
# retry loop).
consecutive = 1
# Maximum seconds the suppression may persist before the daemon resumes
# normal monitoring (so a hung retry banner doesn't suppress recovery
# forever). Default 1800 = 30 minutes.
max_stuck_secs = 1800

[stuck_detection]
# Workload-heartbeat-driven suppression of false-positive stuck alerts.
#
# Long-running `workload run` invocations (stv-promote, big rsyncs, ffmpeg)
# can pin the main loop in a fire-and-forget wait that looks like
# heartbeat-stale or prolonged-thinking from the daemon's vantage. The
# workload wrapper writes + touches a heartbeat file at
# `<workload_heartbeat_dir>/<label>.heartbeat` every 30s while the
# user command runs. Before firing heartbeat-stale OR prolonged-thinking
# alerts, the daemon scans the dir; if ANY file's mtime is within
# `workload_heartbeat_max_age_secs`, the alert is SUPPRESSED.
#
# Distinct from the legacy 15-min `/var/run/claude/workload-state/<label>.heartbeat`
# (consumed by `cron-workload-stale-check` for 1h+ wedged-workload
# detection). The two heartbeats coexist and serve different purposes.
# Note the workload-state subdir lives off `/var/run/claude/` post-2026-05-18
# migration off `/tmp`; a `/tmp/claude-workloads` symlink is maintained
# for back-compat with out-of-tree consumers.
enabled = true
workload_heartbeat_dir = "/run/claude/workloads"
workload_heartbeat_max_age_secs = 60

[queue_check]
# Native in-tree emission of stuck / orphaned queue-item claude-events.
#
# The `claude-watch queue-check` subcommand (run from cron) inspects the
# session-task queue and detects:
#   * ORPHANED — a `running` item that is no longer being worked, via:
#       - an explicitly-claimed owning PID that is no longer alive, OR
#       - the active-agents join: its agent transcript went stale
#         (died-after-spawn), OR no agent record exists AND it was
#         registered more than `no_binding_grace_secs` ago (never-spawned).
#         Workload/hostjob-scoped items are exempt (progress-heartbeat).
#   * STUCK    — a `wedged` item, OR a `running` item whose
#     `last_heartbeat_at` is older than `stale_heartbeat_min`.
# On detection it emits a `queue-orphaned` / `queue-stuck` claude-event
# (single-emit per qid+condition). This is the IN-TREE equivalent of the
# out-of-tree Prometheus `WorkQueueOrphaned` / `WorkQueueStuckSoft` alert
# rules, so stuck/orphan detection no longer depends on external Prometheus.
#
# emit_events is DEFAULT FALSE: the capability ships in every build but
# stays silent unless explicitly enabled here. Detection still runs (so
# `queue-check --dry-run` / `--force-emit` work regardless); this toggle
# only controls whether normal cron runs write event files.
emit_events = false
# Heartbeat-staleness threshold (minutes) for the STUCK condition. Default
# 15 mirrors the deployed WorkQueueStuckSoft `for:15m` window. The
# `--stale-heartbeat-min` CLI flag overrides this per-run.
stale_heartbeat_min = 15
# Grace window (seconds) before a `running` item with NO active-agent
# binding is flagged ORPHANED (the never-spawned case). Reads the
# cron-written active-agents.json to join queue items against agent
# transcript liveness; an item with no matching record and registered_at
# older than this is treated as never-spawned. Default 150s (~2.5 ticks of
# the 60s active-agents cron). The `--no-binding-grace-secs` CLI flag
# overrides per-run. Workload/hostjob-scoped items are exempt.
no_binding_grace_secs = 150

[hybrid]
# Hybrid hooks + daemon-fallback tuning.
#
# When enabled, Claude Code hooks (SessionStart/Stop/PreCompact) fire
# conversational reminders via `claude-watch hook-fire`. The daemon records
# a marker for each fire and defers its heavy-handed tmux injections
# (/clear, claude update) for the configured grace window so Claude has a
# chance to self-act. If the reminder is stale, the daemon falls back to
# the old always-inject behaviour and bumps fallback_*_count metrics.
#
# See `skills/setup-hooks.md` for the installer.
enabled = true
# Grace window after a context_high hook fire before the daemon forces
# `/clear` via tmux. Default 5 minutes.
context_fallback_secs = 300
# Hard ceiling (seconds) on hook-deferral, measured from the FIRST cycle on
# which the context threshold was crossed rather than from the last hook fire.
# context_fallback_secs alone cannot expire on a busy loop: the context_high
# hook re-fires every turn, refreshing the grace window faster than it runs
# down, so the daemon defers forever and the fallback never runs. Anchoring to
# the crossing gives it a real bound. 0 disables the ceiling.
context_fallback_max_secs = 600
# Grace window after a version_update hook fire before the daemon runs
# `claude update`. Default 15 minutes — Claude often needs a few turns to
# hit a stopping point before restarting.
version_fallback_secs = 900

[cadence]
# Daemon-emitted cadence claude-events. The daemon is already a
# long-running monitor loop, so it is the natural source for periodic
# "cadence" signals — replacing a separate self-rescheduling reminder
# background task that the main loop otherwise had to keep restarting.
#
# Two events are emitted on the daemon's monotonic clock:
#   * keepalive       — a POKE FOR QUIET PERIODS, not a schedule. The daemon
#                       ticks every keepalive_interval_secs (300s = 5min) but
#                       EMITS only when nothing has been acked in that whole
#                       window. A loop busy handling real events never sees
#                       one; an idle loop gets something to ack before [ack]
#                       stale_minutes elapses. Its body carries the command to
#                       run (data.ack_command = `event-ack ack-batch`), so the
#                       loop is told the action rather than having to recall
#                       it. Renamed from `heartbeat-tick` 2026-08-22.
#   * memory-reminder — every memory_reminder_interval_secs (1800s = 30min),
#                       carrying the action checklist (update logs, commit
#                       + push repos, etc.).
#
# IMPORTANT: the daemon emits these EVENTS only — it deliberately does NOT
# stamp the liveness timestamp itself. That stays the main loop's job so a
# wedged loop goes stale and the existing stale-detection fires. If the daemon
# stamped it directly it would mask a dead loop.
enabled = true
# Intervals are omitted on purpose: leaving them unset inherits the code
# defaults (KEEPALIVE_INTERVAL_SECS / MEMORY_REMINDER_INTERVAL_SECS in
# src/cadence.rs), which is the single source of truth. Uncomment to override
# on a specific host; otherwise a bump to the const is the only change needed.
#   keepalive_interval_secs = 300          # default: 5min
#   memory_reminder_interval_secs = 1800   # default: 30min
#
# RUNTIME (live) override without editing this file: the loader also layers, at
# highest precedence, the file named by $CLAUDE_WATCH_RUNTIME_CONFIG (if set +
# present), and the daemon auto-reloads when any config layer's mtime changes
# (no SIGHUP needed). The container points that env var at a bind-mounted,
# operator-editable file (~/.config/claude-container/claude-watch.override.toml)
# so cadence can be retuned live, with no image rebuild. See src/config.rs
# `config_layer_paths` / `config_layers_mtime`.

# --- Event-watcher health check (cw-watcher-health-check cron) --------------
# CONSUMED BY THE cw-watcher-health-check CRON SCRIPT, not the claude-watch
# daemon (the daemon ignores unknown sections). Sets how many minutes a
# claude-event may sit unconsumed in the spool dir before the script injects a
# "[CLAUDE-WATCH] WATCHER DOWN: N event(s) unconsumed >Nmin" recovery alert.
# Default 6 -- >= 2x the event watcher's ~3min ($EVENT_WATCH_DEBOUNCE_SECONDS=180)
# debounce window, so a normal debounce never false-fires before the batch
# surfaces. Tunable LIVE (next cron tick) via the runtime override
# ($CLAUDE_WATCH_RUNTIME_CONFIG); an explicit CW_WATCHER_HEALTH_STALE_MIN env
# var still pins/overrides it.
#[watcher_health]
#stale_minutes = 6

[ask_question_monitor]
# AFK auto-reject of a stale interactive AskUserQuestion prompt.
#
# Motivating incident: an unanswered AskUserQuestion froze the main loop.
# A pending interactive question reads as Idle (the menu still renders a
# selection cursor, so the idle-prompt scan classifies it as idle, NOT
# Thinking), so the prolonged-thinking detector never fired and the loop
# sat blocked until the heartbeat-stale alarm finally tripped at 389
# minutes. This monitor gives a FAST, specific
# "AskUserQuestion pending > N min" alarm.
#
# PHASE 1 (current): detect + alarm ONLY. claude-watch emits a
# `ask-question-stale` claude-event + pingme exactly once per pending
# question; it sends NO Escape and injects NOTHING (reject_enabled = false).
# Phase 2 will gate an Escape-based auto-reject on reject_enabled; Phase 3
# will then inject `explanation`. This composes with the already-live
# presence-gate (blocks the question outright when the operator is
# known-away) and heartbeat-stale (eventual last-resort backstop).
#
# Master switch for detection + alarm. Default true.
enabled = true
# Seconds an interactive AskUserQuestion prompt may sit pending (main loop
# blocked, reads as Idle) before the alarm fires. Default 240 (4 min) —
# fast relative to the ~10-15 min heartbeat-stale window.
stale_seconds = 240
# PHASE 2/3 gate. When true, claude-watch will auto-REJECT the stale
# question (Escape) and inject `explanation`. DEFAULT FALSE — Phase 1 ships
# detect + alarm only; the reject path is not yet wired.
reject_enabled = false
# PHASE 3 payload (unused in Phase 1 — no inject happens). The
# "use your judgement" text injected AFTER an auto-reject so the loop
# proceeds autonomously and safely. Carried now so the schema is stable
# across the phased rollout.
explanation = "claude-watch auto-rejected this prompt because it blocked the main loop while the operator was away. Do NOT ask again — use your judgement and proceed autonomously with the safest reasonable default, noting the assumption you made."
