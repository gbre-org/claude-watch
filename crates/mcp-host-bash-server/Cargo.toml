[package]
name = "mcp-host-bash-server"
version = "0.1.0"
edition = "2021"
description = "Single-process host-side MCP server exposing run_command/run_script over streamable-HTTP with a bearer gate and an allow-list policy. Replaces the mcp-proxy + cli-mcp-server + mcp-proxy-auth-shim chain."

[[bin]]
name = "mcp-host-bash-server"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "io-util", "signal"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
warnings = "deny"
