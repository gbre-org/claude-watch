name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  no-warnings:
    name: Warning-Free Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 5

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build release with -D warnings
        run: RUSTFLAGS="-D warnings" cargo build --release --tests
        env:
          # Promote any rustc warning to an error. Keeps dead code,
          # unused imports, etc. out of main. Mirrors the local
          # scripts/git-hooks/pre-commit gate.
          RUSTFLAGS: "-D warnings"

  unit-tests:
    name: Unit + Fixture Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 5

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-nextest
        run: curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C ${CARGO_HOME:-~/.cargo}/bin
        timeout-minutes: 5

      - name: Run unit + fixture tests
        run: cargo nextest run -E 'not binary(~e2e_)'

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 5

      - name: Install tmux
        # Bounded because a stuck runner makes an infra step
        # indistinguishable from a slow one. This `apt-get` and the
        # inotify-tools one below have each wedged twice in the last 60
        # runs; with no step bound they ran until the implicit 360-minute
        # job ceiling, so every later step in the job stayed pending for
        # six hours over a package install that normally takes seconds.
        # 5 minutes is ~9x the slowest healthy run of this step (35s) and
        # >2x the slowest healthy run of any apt step here (134s), so a
        # genuinely slow mirror still passes while a hang fails fast.
        run: sudo apt-get update && sudo apt-get install -y tmux
        timeout-minutes: 5

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-nextest
        run: curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C ${CARGO_HOME:-~/.cargo}/bin
        timeout-minutes: 5

      - name: Start tmux server
        run: tmux start-server

      - name: Run e2e tests
        run: cargo nextest run -E 'binary(~e2e_)' --retries 2
        timeout-minutes: 5

      - name: Run self-login end-to-end tests (real tmux pane)
        # Lives in THIS job because it needs both tmux and a built
        # claude-watch binary; the script self-skips without either, and a
        # self-skip in the shell-test job would be a silent vacuous pass.
        # nextest built the binary above, so no extra cargo build is needed.
        run: make test-self-login-tmux
        timeout-minutes: 5

  queue-minisite-tests:
    name: Queue-minisite Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        # `make test-queue-minisite` runs each suite through
        # `uv run --with flask`, so uv is the only prerequisite — no
        # checked-in venv, no repo-level requirements file.
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        timeout-minutes: 5

      - name: Run queue-minisite end-to-end suites
        # These suites were local-only, so minisite PRs could merge on a
        # "green" CI that never executed a single one of their assertions.
        # Each test_*.py boots the Flask app in-process against a tempdir
        # queue.json; the make target runs every file and fails the job on
        # the first non-zero exit.
        run: make test-queue-minisite
        timeout-minutes: 10

  container-shell-tests:
    name: Container shell + shim tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check baked-doc markdown links (no broken links)
        run: make test-doc-links

      - name: Check CLAUDE.md size budget (always-in-context guard)
        # Fails if a tracked CLAUDE.md exceeds its char ceiling (generic 40k;
        # container/baked-CLAUDE.md pinned by a ratchet allowlist so it can't
        # grow). CI is the REAL enforcement — the local pre-commit hook that
        # runs the same script is bypassable with `git commit --no-verify`.
        run: make test-claude-md-size

      - name: Run install-hooks (core.hooksPath + worktree) tests
        run: make test-install-hooks

      # Skills installer: the skills/ (any deployment) vs container/skills/
      # (container-only) split, the `cw-` host prefix, and the
      # refuse-to-clobber / prune-only-our-own rules for the operator-managed
      # commands dir. Also guards every shipped skill against private-path
      # leakage — this repo is public. Runs against tmpdirs only.
      - name: Run host-skills installer tests
        run: make test-install-host-skills

      # Host cron fragment + its installer: that cron.d/cw-host is fully
      # parameterized (this repo is public, and a second deployment must be
      # able to consume the same fragment), that rendering resolves every
      # placeholder, and that deploy-systemd depends on `install` so the
      # $BIN_DIR daemon copy cannot drift from the one the service runs.
      # Tmpdirs only — never touches /etc/cron.d.
      - name: Run host-cron installer tests
        run: make test-install-host-cron

      - name: Run claude-tmux env passthrough + fail-loud warning tests
        run: make test-claude-tmux-env

      - name: Run cron-toggle (cw-cron-run + cw-cron-toggle) tests
        run: make test-cron-toggle

      - name: Run exec-hook shim tests
        run: make test-hooks-shim

      - name: Run agent-msg embedded test suite
        run: make test-agent-msg

      - name: Run agent-tail embedded test suite
        run: make test-agent-tail

      - name: Run event-must-act toolchain tests
        run: make test-event-must-act

      - name: Run pr-branches tests
        run: make test-pr-branches

      - name: Run entrypoint CLAUDE_CMD construction tests
        run: make test-entrypoint

      - name: Run cw host-shim tests
        run: make test-cw

      - name: Install uv (for hostjob + session-task tests)
        # test-hostjob shells out to `uv run --python 3.11 ...`; without
        # uv on PATH that step dies with exit 127. Install once here and
        # push it onto $GITHUB_PATH so every subsequent step (hostjob,
        # session-task, obligations, hooks) resolves uv without a
        # per-step export. Mirrors the curl installer used for the
        # session-task suites below.
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        timeout-minutes: 5

      - name: Run hostjob detached-runner tests
        run: make test-hostjob

      - name: Run launchd plist tests
        run: make test-launchd-plist

      - name: Run personal-mcp-host wrapper tests
        run: make test-personal-mcp-host

      - name: Run personal-mcp-host launchd plist tests
        run: make test-personal-mcp-host-plist

      - name: Run personal-mcp-host install.sh tests
        run: make test-personal-mcp-install

      - name: Run ttyd paste-handler tests
        run: make test-ttyd-paste-handler

      - name: Run ttyd lock-toggle tests
        run: make test-ttyd-lock-toggle

      - name: Install inotify-tools (for claude-event-watch tests)
        # Same exposure as the tmux install in the e2e job, and it hung on
        # the same two days. Slowest healthy run of this step was 134s.
        run: sudo apt-get update && sudo apt-get install -y inotify-tools
        timeout-minutes: 5

      - name: Run watcher tests (self-clear/self-login + claude-event-watch debounce)
        run: make test-watchers
        timeout-minutes: 5

      - name: Install session-task companion CLIs onto PATH
        # `make install` would build claude-watch via cargo (heavy), so
        # we mirror just the script-symlink portion here. The
        # session-task force-start tests shell out to `obligations` and
        # `claude-event`; without both on PATH the registration / emit
        # calls silently no-op and tests assert on a missing
        # obligations.json. Symlinks let in-tree edits take effect
        # without a re-install round-trip.
        run: |
          mkdir -p "$HOME/bin"
          ln -sfn "$(pwd)/tools/session-task/session-task" "$HOME/bin/session-task"
          ln -sfn "$(pwd)/tools/obligations/obligations" "$HOME/bin/obligations"
          ln -sfn "$(pwd)/tools/claude-event/claude-event" "$HOME/bin/claude-event"
          ln -sfn "$(pwd)/tools/claude-event/claude-event-tail" "$HOME/bin/claude-event-tail"

      - name: Run session-task Python tests
        run: |
          export PATH="$HOME/.local/bin:$HOME/bin:$PATH"
          make test-session-task

      - name: Run obligations-init pytest suite (user-manifest idempotency)
        run: |
          export PATH="$HOME/.local/bin:$HOME/bin:$PATH"
          make test-obligations-init

      - name: Run obligations / hooks tests
        # These suites were previously local-only, which let a hook
        # behavior change merge while leaving its test failing on a
        # clean main checkout (caught only on the next local run).
        # Needs the companion-CLI symlinks from the step above
        # (pre-agent-queue-gate-hook.test exercises the real
        # session-task binary).
        run: |
          export PATH="$HOME/.local/bin:$HOME/bin:$PATH"
          make test-hooks
