name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  no-warnings:
    name: Warning-Free Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 5

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build release with -D warnings
        run: RUSTFLAGS="-D warnings" cargo build --release --tests
        env:
          # Promote any rustc warning to an error. Keeps dead code,
          # unused imports, etc. out of main. Mirrors the local
          # scripts/git-hooks/pre-commit gate.
          RUSTFLAGS: "-D warnings"

  unit-tests:
    name: Unit + Fixture Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 5

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-nextest
        run: curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C ${CARGO_HOME:-~/.cargo}/bin
        timeout-minutes: 5

      - name: Run unit + fixture tests
        run: cargo nextest run -E 'not binary(~e2e_)'

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 5

      # NOTE: there is deliberately no `Install tmux` step here. tmux ships
      # PREINSTALLED on GitHub's ubuntu-latest image, so the install this job
      # used to run was a measured no-op — apt reported "tmux is already the
      # newest version (3.4-1ubuntu0.1). 0 upgraded, 0 newly installed" — and
      # the only thing it actually did was trigger an ~11 MB `apt-get update`,
      # which is where the intermittent Ubuntu-mirror wedge lives. Removing
      # the step removes this job's entire apt exposure. `Start tmux server`
      # below asserts tmux's presence, so a future image dropping it fails
      # loudly and instantly rather than mysteriously.

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-nextest
        run: curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C ${CARGO_HOME:-~/.cargo}/bin
        timeout-minutes: 5

      - name: Start tmux server
        # `tmux -V` first: this job no longer installs tmux (see the note
        # above), so this is the assertion that the runner image still
        # provides it. It costs milliseconds and turns a hypothetical future
        # image change into a one-line failure instead of a confusing e2e
        # test collapse.
        run: |
          tmux -V
          tmux start-server

      - name: Run e2e tests
        run: cargo nextest run -E 'binary(~e2e_)' --retries 2
        timeout-minutes: 5

      - name: Run self-login end-to-end tests (real tmux pane)
        # Lives in THIS job because it needs both tmux and a built
        # claude-watch binary; the script self-skips without either, and a
        # self-skip in the shell-test job would be a silent vacuous pass.
        # nextest built the binary above, so no extra cargo build is needed.
        run: make test-self-login-tmux
        timeout-minutes: 5

  queue-minisite-tests:
    name: Queue-minisite Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        # `make test-queue-minisite` runs each suite through
        # `uv run --with flask`, so uv is the only prerequisite — no
        # checked-in venv, no repo-level requirements file.
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        timeout-minutes: 5

      - name: Run queue-minisite end-to-end suites
        # These suites were local-only, so minisite PRs could merge on a
        # "green" CI that never executed a single one of their assertions.
        # Each test_*.py boots the Flask app in-process against a tempdir
        # queue.json; the make target runs every file and fails the job on
        # the first non-zero exit.
        run: make test-queue-minisite
        timeout-minutes: 10

      - name: Run cw-agent-stats producer tests (agentstats library + CLI)
        # The host-side producer of the agent-stats.json snapshot the
        # minisite suites above consume. Lives in the same job on purpose:
        # one side pins the snapshot schema from the producer, the other
        # from the consumer, so a shape change that forgets either fails
        # here. pytest supplied by uv (installed above).
        run: make test-cw-agent-stats
        timeout-minutes: 5

  container-shell-tests:
    name: Container shell + shim tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check baked-doc markdown links (no broken links)
        run: make test-doc-links

      - name: Check CLAUDE.md size budget (always-in-context guard)
        # Fails if a tracked CLAUDE.md exceeds its char ceiling (generic 40k;
        # container/baked-CLAUDE.md pinned by a ratchet allowlist so it can't
        # grow). CI is the REAL enforcement — the local pre-commit hook that
        # runs the same script is bypassable with `git commit --no-verify`.
        run: make test-claude-md-size

      - name: Run install-hooks (core.hooksPath + worktree) tests
        run: make test-install-hooks

      # `make help` is the entry point for both deployment shapes, and it is
      # generated by an awk pass over the Makefile's `##@ ` / `## `
      # conventions. Nothing enforced them, so a target added without an
      # annotation just never showed up in the index. Cheap + read-only.
      - name: Run make-help index gate
        run: make test-make-help

      # The bounded/retrying apt wrapper THIS workflow's package-install
      # steps run through. Deliberately placed before the step that uses it
      # so a broken wrapper is reported as a wrapper failure rather than as
      # a mysterious install failure later in the job. Fakes only.
      - name: Run CI apt-installer (hang + retry) tests
        run: make test-ci-apt-install
        timeout-minutes: 5

      # Skills installer: the skills/ (any deployment) vs container/skills/
      # (container-only) split, the `cw-` host prefix, and the
      # refuse-to-clobber / prune-only-our-own rules for the operator-managed
      # commands dir. Also guards every shipped skill against private-path
      # leakage — this repo is public. Runs against tmpdirs only.
      - name: Run host-skills installer tests
        run: make test-install-host-skills

      # Host cron fragment + its installer: that cron.d/cw-host is fully
      # parameterized (this repo is public, and a second deployment must be
      # able to consume the same fragment), that rendering resolves every
      # placeholder, and that deploy-systemd depends on `install` so the
      # $BIN_DIR daemon copy cannot drift from the one the service runs.
      # Tmpdirs only — never touches /etc/cron.d.
      - name: Run host-cron installer tests
        run: make test-install-host-cron

      # `install` target's TOOL_LINKS / MULTICALL_NAMES coverage: every
      # source path resolves, `make -n install` lists every tool this repo
      # ships (including the 10 names a 2026-08-22 host migration found
      # missing), and the symlinking is idempotent. Tmpdirs + `make -n`
      # only — no cargo build.
      - name: Run install-links tests
        run: make test-install-links

      - name: Run claude-tmux env passthrough + fail-loud warning tests
        run: make test-claude-tmux-env

      - name: Run cron-toggle (cw-cron-run + cw-cron-toggle) tests
        run: make test-cron-toggle

      - name: Run eval-queue-ready-unspawned obligation evaluator tests
        run: make test-eval-queue-ready-unspawned

      - name: Run exec-hook shim tests
        run: make test-hooks-shim

      - name: Run agent-msg embedded test suite
        run: make test-agent-msg

      - name: Run agent-tail embedded test suite
        run: make test-agent-tail

      - name: Run claude-event + claude-event-tail unit tests
        run: make test-claude-event

      - name: Run dashboard-lib.sh parser tests
        run: make test-dashboard

      - name: Install inotify-tools (for every suite that drives claude-event-watch)
        # The ONLY apt install left in CI — inotify-tools is genuinely absent
        # from the runner image (unlike tmux, whose step is gone entirely).
        #
        # PLACEMENT IS LOAD-BEARING: this must precede EVERY step that runs
        # the real claude-event-watch, not just `test-watchers`. It used to sit
        # ~45 lines further down, which was fine until `test-event-must-act`
        # grew an end-to-end suite that also drives the watcher. Without
        # inotifywait the watcher hard-exits before draining anything, so that
        # suite's queue stayed full and 11 of its 12 cases failed on state that
        # was never written — a missing package wearing a classifier bug's
        # costume. New watcher-driven suites go AFTER this step.
        #
        # This step is where the wedge was captured in full: apt cycling
        # `Ign:` on the runner's azure.archive.ubuntu.com mirror, falling
        # back to archive.ubuntu.com, and timing out part-way through the
        # index refresh — three attempts in a row, all against the same dead
        # mirror. So scripts/ci-apt-install.sh now (a) installs straight from
        # the image's pre-baked package lists and only runs `apt-get update`
        # if that fails, and (b) drops the stalling mirror from the runner's
        # mirrorlist before any retry, so a retry actually goes somewhere new.
        #
        # `timeout-minutes: 5` STAYS as the outer backstop. Before it existed
        # these hangs ran to the implicit 360-minute job ceiling, so a larger
        # bound buys longer failures, not passes — and without it a
        # restructured step would silently revert to that ceiling. But a cap
        # alone only converts the hang into a failed job, because the first
        # wedged attempt consumes the whole budget and nothing retries. The
        # script's inner bound is what leaves the retry room to succeed.
        run: scripts/ci-apt-install.sh inotify-tools
        timeout-minutes: 5

      - name: Run event-must-act toolchain tests
        run: make test-event-must-act

      - name: Run pr-branches tests
        run: make test-pr-branches

      - name: Run entrypoint CLAUDE_CMD construction tests
        run: make test-entrypoint

      - name: Run container ~/.claude state helper tests
        run: make test-trust-workspace

      - name: Run cw host-shim tests
        run: make test-cw

      - name: Install uv (for hostjob + session-task tests)
        # test-hostjob shells out to `uv run --python 3.11 ...`; without
        # uv on PATH that step dies with exit 127. Install once here and
        # push it onto $GITHUB_PATH so every subsequent step (hostjob,
        # session-task, obligations, hooks) resolves uv without a
        # per-step export. Mirrors the curl installer used for the
        # session-task suites below.
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        timeout-minutes: 5

      - name: Run hostjob detached-runner tests
        run: make test-hostjob

      - name: Run launchd plist tests
        run: make test-launchd-plist

      - name: Run personal-mcp-host wrapper tests
        run: make test-personal-mcp-host

      - name: Run personal-mcp-host launchd plist tests
        run: make test-personal-mcp-host-plist

      - name: Run personal-mcp-host install.sh tests
        run: make test-personal-mcp-install

      - name: Run ttyd paste-handler tests
        run: make test-ttyd-paste-handler

      - name: Run ttyd lock-toggle tests
        run: make test-ttyd-lock-toggle

      - name: Run watcher tests (self-clear/self-login + claude-event-watch debounce)
        run: make test-watchers
        timeout-minutes: 5

      # The claude-events-exporter suite needs uv (installed a few steps
      # above and pushed onto $GITHUB_PATH) to pull prometheus_client.
      - name: Run claude-events-exporter tests
        run: make test-claude-events-exporter
        timeout-minutes: 5

      # Same uv-provided prometheus_client as the suite above.
      - name: Run work-queue-exporter tests
        run: make test-work-queue-exporter
        timeout-minutes: 5

      # Same uv-provided prometheus_client as the suites above.
      - name: Run agent-psi-exporter tests
        run: make test-agent-psi-exporter
        timeout-minutes: 5

      - name: Install session-task companion CLIs onto PATH
        # `make install` would build claude-watch via cargo (heavy), so
        # we mirror just the script-symlink portion here. The
        # session-task force-start tests shell out to `obligations` and
        # `claude-event`; without both on PATH the registration / emit
        # calls silently no-op and tests assert on a missing
        # obligations.json. Symlinks let in-tree edits take effect
        # without a re-install round-trip.
        run: |
          mkdir -p "$HOME/bin"
          ln -sfn "$(pwd)/tools/session-task/session-task" "$HOME/bin/session-task"
          ln -sfn "$(pwd)/tools/obligations/obligations" "$HOME/bin/obligations"
          ln -sfn "$(pwd)/tools/claude-event/claude-event" "$HOME/bin/claude-event"
          ln -sfn "$(pwd)/tools/claude-event/claude-event-tail" "$HOME/bin/claude-event-tail"

      - name: Run session-task Python tests
        run: |
          export PATH="$HOME/.local/bin:$HOME/bin:$PATH"
          make test-session-task

      - name: Run obligations-init pytest suite (user-manifest idempotency)
        run: |
          export PATH="$HOME/.local/bin:$HOME/bin:$PATH"
          make test-obligations-init

      - name: Run obligations / hooks tests
        # These suites were previously local-only, which let a hook
        # behavior change merge while leaving its test failing on a
        # clean main checkout (caught only on the next local run).
        # Needs the companion-CLI symlinks from the step above
        # (pre-agent-queue-gate-hook.test exercises the real
        # session-task binary).
        run: |
          export PATH="$HOME/.local/bin:$HOME/bin:$PATH"
          make test-hooks
