# claude-watch.rules.yml -- Prometheus recording + alert rules for the
# claude-watch work-queue / owner-liveness stack.
#
# ##########################################################################
# #4039: THESE RULES ARE VERSION-CONTROLLED IN THE claude-watch REPO.
# ##########################################################################
# The local Grafana/Prometheus COMPOSE stack lives out-of-tree (in
# andrew-sf-tools/monitoring/), but the alert/recording RULES that encode
# claude-watch's own semantics belong HERE, next to the two Python exporters
# that emit the metrics (exporters/work-queue-exporter/,
# exporters/claude-events-exporter/). This is the single source of truth:
# any deployment (the local stack, gomorrah/gb, a future hosted Prometheus)
# should symlink or copy THIS file rather than fork its own drifting copy.
#
# Load it into Prometheus via `rule_files:` in prometheus.yml, e.g.:
#     rule_files:
#       - /etc/prometheus/rules/claude-watch.rules.yml
# then mount this path (or a CW_REPO_DIR-relative bind) into the container.
# Validate with `promtool check rules monitoring/prometheus/claude-watch.rules.yml`.
#
# ## Two-stage orphan escalation ladder (Andrew, #4038/#4039)
#
# A `running` queue item that loses its owner is surfaced in TWO stages,
# fast-then-slow, so the main loop gets an actionable nudge long before the
# heavier external alert fires:
#
#   STAGE 1 -- claude-event (in-tree, FAST, ~2.5 min).
#     `claude-watch queue-check` (cron, every 5 min) emits a `queue-orphaned`
#     claude-event once a running item has had NO agent binding for
#     `[queue_check] no_binding_grace_secs` (default 150s). The event routes
#     to the ACTIONABLE tier -- the main loop is expected to re-register,
#     re-spawn, or abandon the item. This is the FIRST and PRIMARY signal;
#     it needs no Prometheus at all.
#
#   STAGE 2 -- Prometheus WorkQueueOrphaned (external, SLOW, ~15 min).
#     If the item is STILL unowned much later, the work-queue-exporter emits
#     has_live_owner=0 (once `last_heartbeat_at` is stale past
#     ORPHAN_HEARTBEAT_STALE_SECONDS, default 600s) and the alert below adds
#     `for: 5m` on top -- so it fires ~15 min after register, an order of
#     magnitude past the Stage-1 event grace. That ordering is DELIBERATE:
#     Prometheus is the escalation/paging backstop for an orphan the main
#     loop failed to clear after the actionable event, NOT the first-line
#     notifier. Keep `for` + the exporter stale window comfortably longer
#     than `no_binding_grace_secs` so the event always leads.
#
# Owner attribution note: the exporter + queue-minisite resolve a running
# item's owner from claude-watch active-agents.json AND the arm-hook
# agent-queue-bindings.json (queue_id -> agent_id, written synchronously at
# spawn). A bound item is treated as OWNED even during active-agents poll
# lag, so has_live_owner=0 fires only for GENUINELY owner-less items -- the
# never-spawned / died-after-spawn cases WorkQueueOrphaned is meant to catch.
#
# Metric provenance:
#   worktask_queue_*  -> exporters/work-queue-exporter/work_queue_exporter.py
#   claude_events_*   -> exporters/claude-events-exporter/claude_events_exporter.py
#   claude_watch_* / claude_code_* -> `claude-watch metrics` textfile (src/metrics.rs)

groups:
  # ----------------------------------------------------------------------
  # Recording rules -- pre-aggregated series for dashboards + for gb to
  # reuse without re-deriving the joins. Cheap, evaluated every interval.
  # ----------------------------------------------------------------------
  - name: claude-watch-work-queue.recording
    rules:
      # Count of running queue items currently flagged orphaned (no live
      # owner). Drives the "orphaned running items" stat tile and lets gb
      # alert on a COUNT rather than per-series. agent_id="" ones are
      # never-spawned; agent_id!="" ones died after spawn -- summed here.
      - record: worktask:queue_items_orphaned:count
        expr: count(worktask_queue_item_has_live_owner{status="running"} == 0) or vector(0)

      # Count of running items with a healthy live owner. Useful as the
      # denominator for an "owned vs orphaned" ratio panel.
      - record: worktask:queue_items_owned:count
        expr: count(worktask_queue_item_has_live_owner{status="running"} == 1) or vector(0)

      # Never-spawned subset (owner-less AND no agent_id) -- the main-loop
      # "registered but never spawned an Agent" failure mode specifically.
      - record: worktask:queue_items_orphaned_never_spawned:count
        expr: count(worktask_queue_item_has_live_owner{status="running", agent_id=""} == 0) or vector(0)

  # ----------------------------------------------------------------------
  # Alert rules.
  # ----------------------------------------------------------------------
  - name: claude-watch-work-queue
    rules:
      # WorkQueueOrphaned -- STAGE 2 of the escalation ladder (see header).
      # A RUNNING queue item whose owning agent is no longer alive. The
      # exporter emits has_live_owner for both running and blocked items;
      # we filter to {status="running"} so blocked items (no live agent BY
      # DESIGN) never fire. Items with an alive owner (has_live_owner=1) or
      # no signal at all are excluded, so `== 0` matches only genuine
      # orphans: never-spawned (agent_id empty) or died-after-spawn
      # (agent_id set). `for: 5m` on top of the exporter's 600s stale window
      # keeps this ~15 min behind register -- well past the Stage-1
      # queue-orphaned claude-event (~2.5 min), so this is the escalation
      # backstop, not the first notifier.
      - alert: WorkQueueOrphaned
        expr: worktask_queue_item_has_live_owner{status="running"} == 0
        for: 5m
        labels:
          severity: warning
          stage: escalation
        annotations:
          summary: "Work-queue item {{ $labels.id }} is running but orphaned"
          description: >-
            Running queue item {{ $labels.id }} ({{ $labels.summary }}) has no
            live agent owner (agent "{{ $labels.agent_id }}"; empty =
            never-spawned, set = died-after-spawn) and remained so long after
            the Stage-1 queue-orphaned claude-event should have prompted the
            main loop. Re-register + re-spawn the work, or abandon the item.

      # WorkQueueStuckSoft -- a running item with long runtime AND stale (or
      # absent) progress. WorkQueueStuck joins running_elapsed against
      # progress_age and fires on items WITHOUT a progress series (agents)
      # OR WITH stale progress (workloads); the `unless on(id)` half excludes
      # healthy long-running workloads still emitting a fresh heartbeat.
      # 15m mirrors config.toml [queue_check] stale_heartbeat_min = 15.
      - alert: WorkQueueStuckSoft
        expr: >-
          (worktask_queue_items_running_elapsed_seconds > 900)
          unless on(id) (worktask_queue_item_progress_age_seconds < 900)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Work-queue item {{ $labels.id }} appears stuck"
          description: >-
            Running queue item {{ $labels.id }} ({{ $labels.summary }}) has
            been running >15m with no fresh progress heartbeat. Healthy
            long-running workloads that keep touching their progress
            heartbeat are excluded via the `unless on(id)` join.

      # WorkQueueReadyStuck -- a ready-to-spawn pending item unclaimed too
      # long. The exporter only emits ready_age for pending group-heads that
      # are NOT scope-locked and have empty dep_blockers, so this gauge is
      # already the "genuinely waiting" set.
      - alert: WorkQueueReadyStuck
        expr: worktask_queue_item_ready_age_seconds > 1800
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Ready work-queue item {{ $labels.id }} is unclaimed"
          description: >-
            Pending, ready (group-head, unlocked, no dep blockers) queue item
            {{ $labels.id }} ({{ $labels.summary }}) has waited >30m for the
            main loop to spawn it.

      # AgentStateFileMissing -- the exporter sets agent_state_last_modified
      # to 0 when claude-watch's active-agents.json is missing; a sustained 0
      # means claude-watch stopped publishing the file, which also BLINDS
      # WorkQueueOrphaned (Stage 2 goes dark). Alert so the blindness itself
      # is visible.
      - alert: AgentStateFileMissing
        expr: worktask_queue_agent_state_last_modified == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "claude-watch active-agents state file missing"
          description: >-
            worktask_queue_agent_state_last_modified has been 0 for >10m --
            claude-watch is not publishing active-agents.json, so owner
            liveness (WorkQueueOrphaned) is blind. Check the active-agents
            cron / daemon.

  - name: claude-watch-events
    rules:
      # ClaudeEventsBacklogStale -- the oldest unconsumed event has aged out,
      # the signal of a wedged main loop / dead claude-event-watch watcher.
      - alert: ClaudeEventsBacklogStale
        expr: claude_events_age_seconds > 600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "claude-events backlog is going stale"
          description: >-
            Oldest unconsumed claude-event is >10m old. Suggests a wedged
            main loop or a dead claude-event-watch watcher.

  - name: claude-watch-daemon
    rules:
      # ClaudeWatchDown -- the daemon writes claude_watch_up 0 when its state
      # file is unreadable, or the target is absent.
      - alert: ClaudeWatchDown
        expr: claude_watch_up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "claude-watch daemon is down or state file unreadable"
          description: >-
            claude_watch_up == 0 -- claude-watch's state.json is unreadable or
            the daemon is not running.

      # ClaudeWatchersMissing -- enabled watchers that have gone missing.
      - alert: ClaudeWatchersMissing
        expr: claude_watchers_missing > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} claude-watch watcher(s) missing"
          description: >-
            claude_watchers_missing > 0 -- one or more enabled watchers have
            gone missing. The daemon's watcher_down interrupt handles this
            in-tree; this is the external mirror.

      # ClaudeMainLoopHeartbeatStale -- the host main-loop heartbeat FILE
      # mtime has frozen, the canonical wedge signal. Only emitted when the
      # heartbeat file exists, so absent != firing.
      - alert: ClaudeMainLoopHeartbeatStale
        expr: time() - claude_mainloop_heartbeat_timestamp_seconds > 900
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "claude main-loop heartbeat is stale"
          description: >-
            The host main-loop heartbeat file hasn't been touched in >15m.
            The main loop is likely wedged.
